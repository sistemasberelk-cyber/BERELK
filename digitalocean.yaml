name: vibecloud-app
region: nyc
services:
  - name: vibecloud-backend
    github:
      branch: main
      repo: sistemasberelk-cyber/vibecloud-backend
    run_command: uvicorn main:app --host 0.0.0.0 --port ${PORT}
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.REDIS_URL}
      - key: SECRET_KEY
        scope: RUN_TIME
        value: default-secret-key-change-in-prod
      - key: BASE_DOMAIN
        scope: RUN_TIME
        value: vibecloud.com
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        value: ${GEMINI_API_KEY}

  - name: vibecloud-worker
    github:
      branch: main
      repo: sistemasberelk-cyber/vibecloud-backend
    run_command: python -m workers.sync_queue_worker
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.REDIS_URL}

  - name: vibecloud-medusa
    github:
      branch: main
      repo: sistemasberelk-cyber/vibecloud-medusa
    run_command: npm run start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /medusa
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${medusa_db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.REDIS_URL}

  - name: vibecloud-storefront
    github:
      branch: main
      repo: sistemasberelk-cyber/vibecloud-storefront
    run_command: npm run start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /storefront
    envs:
      - key: NEXT_PUBLIC_MEDUSA_BACKEND_URL
        scope: RUN_TIME
        value: https://vibecloud-medusa.ondigitalocean.app

databases:
  - engine: pg
    name: db
    num_nodes: 1
    size: db-s-dev-1
    version: "15"
  - engine: pg
    name: medusa_db
    num_nodes: 1
    size: db-s-dev-1
    version: "15"
  - engine: redis
    name: redis
    num_nodes: 1
    size: redis-s-dev-1
